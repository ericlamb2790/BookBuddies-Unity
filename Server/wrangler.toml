# BookBuddies Unity server: a NEW Cloudflare Worker, separate from the website's.
# Setup steps are in README.md next to this file.

name = "bookbuddies-unity"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Optional: only let one website call the API from a browser. Desktop and phone builds ignore this.
# [vars]
# ALLOWED_ORIGIN = "https://example.com"

# The database for players, sign-ins and daily limits. Tables are made automatically on first use.
# Run `npx wrangler d1 create bookbuddies-unity` and paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "bookbuddies-unity"
database_id = "4a09c69f-2ab8-4e91-9a42-dd65964ff29e"

# The live town rooms. Each copy of Pawtopia (rooms 1 to 6) is one Durable Object.
[[durable_objects.bindings]]
name = "TOWNS"
class_name = "TownRoom"

# SQLite-backed Durable Objects work on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TownRoom"]

[observability]
enabled = true
